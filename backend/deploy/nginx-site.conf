# nginx site for the second-opinion backend (TASK-020, REQ-SEC-005).
# Alternative to the Caddyfile for servers that already run nginx.
# Install as /etc/nginx/sites-available/<domain>, link it into sites-enabled, then run
#   certbot --nginx -d <domain> -d www.<domain> --redirect
# which adds the HTTPS server block, the certificate and the HTTP-to-HTTPS redirect.
#
# Only /v1/check and /healthz reach the backend. Everything else on the domain keeps going
# to whatever the server already hosts (here: the existing Node app on port 3000).

server {
	listen 80;
	listen [::]:80;
	server_name jeanlafrance.xyz www.jeanlafrance.xyz;

	server_tokens off;

	# Second-opinion API. Exact matches, so nothing else is exposed.
	location = /v1/check {
		# Reject oversized uploads before they reach Node (the service enforces 5 MB too).
		client_max_body_size 5m;
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# Overwrite, never append: the backend rate-limits by this address, so a client
		# must not be able to supply its own.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
		# Access logs would record client addresses (REQ-PRV-002).
		access_log off;
	}

	location = /healthz {
		proxy_pass http://127.0.0.1:8787;
		access_log off;
	}

	# Existing site, unchanged.
	location / {
		proxy_http_version 1.1;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# [::1], not localhost: the existing app listens on IPv6 loopback only, and "localhost"
		# makes nginx try 127.0.0.1 first and log a refused connection on every request.
		proxy_pass http://[::1]:3000;
	}
}
