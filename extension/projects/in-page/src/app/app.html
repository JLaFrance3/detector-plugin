@if (!store.hidden()) {
  @for (badge of store.badges(); track badge.id) {
    @if (badge.visible) {
      <button
        #badgeButton
        type="button"
        class="aid-badge"
        [class.aid-definite]="badge.view.kind === 'definite'"
        [class.aid-likely]="badge.view.kind === 'likely'"
        [class.aid-neutral]="badge.view.kind === 'none'"
        [class.aid-revealed]="store.hoveredId() === badge.id || store.openId() === badge.id"
        [class.aid-open]="store.openId() === badge.id"
        [style.left.px]="badge.left"
        [style.top.px]="badge.top"
        [attr.data-badge]="badge.id"
        [attr.aria-label]="badge.view.tooltip"
        [attr.aria-expanded]="store.openId() === badge.id"
        aria-haspopup="dialog"
        (click)="store.toggle(badge.id)"
      >
        <span
          class="aid-chip"
          [class.aid-chip-likely]="badge.view.kind === 'likely'"
          [class.aid-chip-neutral]="badge.view.kind === 'none'"
          aria-hidden="true"
          >{{ chipText(badge.view.kind) }}</span
        >
        <span class="aid-tip" aria-hidden="true">{{ badge.view.tooltip }}</span>
      </button>
    }
  }

  @if (store.openBadge(); as open) {
    <aid-popover [badge]="open" />
  }
}
